name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pyinstaller==6.16.0
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Palvault-Windows
          path: dist/Palvault/
